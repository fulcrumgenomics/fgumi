[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

# Loom model checks (the `loom` CI job). The longest model takes ~18 s locally
# and several times that on a small runner, so the default 2-minute kill could
# fail a healthy model. The budget here is per model, 150 s x 4 = 10 minutes. The
# job runs three loom steps (each with its release build) in sequence under one
# 20-minute timeout, so a model that hangs early fails as a nextest timeout
# naming it, while one that hangs late may surface as a cancelled job instead.
# nextest (unlike `cargo test`) fails on zero tests run, which is what catches a
# `cfg(loom)` test target that compiled to an empty binary.
[profile.loom]
slow-timeout = { period = "150s", terminate-after = 4 }
