[package]
name = "fgumi-sort"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "High-performance external merge-sort engine for BAM files"
repository.workspace = true
license.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "science"]
keywords = ["bioinformatics", "bam", "sort", "sequencing", "ngs"]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[lints.rust]
# `loom` is a config flag set only for the model-checking test target
# (`tests/loom_merge_slots.rs`, run via `RUSTFLAGS="--cfg loom"`). Declare it so
# the unexpected-cfg lint stays quiet under the normal `-D warnings` build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
fgumi-raw-bam = { workspace = true, features = ["noodles"] }
fgumi-bgzf = { workspace = true }
fgumi-bam-io = { workspace = true }
fgumi-dna = { workspace = true }
noodles = { workspace = true, features = ["bam", "sam", "core", "csi"] }
noodles-bgzf = { workspace = true }
libdeflater = { workspace = true }
libmimalloc-sys = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-queue = { workspace = true }
crossbeam-utils = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
bytemuck = { workspace = true }
ahash = { workspace = true }
anyhow = { workspace = true }
bstr = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
fs4 = { workspace = true }
log = { workspace = true }
# `smallvec` is crate-local, not workspace-inherited: `keys.rs` is its only user
# in the workspace, and the root manifest reserves `[workspace.dependencies]` for
# crates shared by two or more members.
smallvec = { version = "1.15", features = ["const_generics"] }
zstd = "0.13"
voracious_radix_sort = { version = "1", features = ["voracious_multithread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# `process` adds `getrlimit`, used by `fd_limit`. See the workspace entry.
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[features]
default = []
memory-debug = []
test-utils = []

[dev-dependencies]
fgumi-bam-io = { workspace = true }
fgumi-raw-bam = { workspace = true, features = ["test-utils", "noodles"] }
fgumi-sam = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

# loom is only compiled under `--cfg loom`. It is a *regular* (not dev)
# dependency so `merge_slots.rs` itself can swap `std::sync` -> `loom::sync`
# under `#[cfg(loom)]` and have its REAL atomics/locks model-checked by
# `tests/loom_merge_slots.rs` (which drives the real `SortMergeSlot`). The test
# is `#![cfg(loom)]` (empty under a normal build).
# Run with:  RUSTFLAGS="--cfg loom" cargo test -p fgumi-sort --test loom_merge_slots --release
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "chunk_sorter"
harness = false

[[bench]]
name = "queryname_keys"
harness = false
