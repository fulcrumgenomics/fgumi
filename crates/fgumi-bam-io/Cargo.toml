[package]
name = "fgumi-bam-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "BAM I/O factories and pipeline primitives for the fgumi family of crates"
repository.workspace = true
license.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "science"]
keywords = ["bioinformatics", "bam", "sequencing", "ngs"]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[dependencies]
ahash = { workspace = true }
fgumi-raw-bam = { workspace = true, features = ["noodles"] }
fgumi-bgzf = { workspace = true }
noodles = { workspace = true, features = ["bam", "fasta", "sam", "bgzf", "core", "vcf"] }
noodles-bgzf = { workspace = true }
noodles-csi = { workspace = true }
bgzf = { workspace = true }
flate2 = { workspace = true }
anyhow = { workspace = true }
bstr = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }

[features]
# Exposes `pread::test_sources` (in-memory and fault-injecting positional
# sources) to downstream crates' tests.
test-utils = []

# `unistd::close` (checked close of output files, all Unix) needs no feature;
# `fs` (the workspace default) is for `posix_fadvise`, used on Linux only.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bgzf_decode"
harness = false
