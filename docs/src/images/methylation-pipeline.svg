<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 624" width="800" height="624" role="img" aria-labelledby="t d"><title id="t">The methylation consensus pipeline</title><desc id="d">Pipeline: fgumi extract, optional fgumi correct, alignment with bwa-mem3 mem --meth and fgumi zipper, then fgumi sort and fgumi group. It then splits: fgumi simplex, re-alignment with bwa-mem3 mem --meth -Y, fgumi filter --ref and a coordinate sort, then MethylDackel-style callers; or fgumi duplex, standard re-alignment with bwa-mem3 mem -Y, fgumi filter and a coordinate sort, then modkit pileup-hemi or variant callers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#586a74"/></marker></defs><rect x="0.5" y="0.5" width="799" height="623" rx="10" fill="#ffffff" stroke="#d3dde1"/><rect x="200.0" y="20" width="400" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="400" y="39" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">fgumi extract</text><text x="400" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">FASTQ in, UMIs moved into tags</text><line x1="400" y1="66" x2="400" y2="82" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="200.0" y="84" width="400" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1" stroke-dasharray="5 4"/><text x="400" y="103" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">fgumi correct</text><text x="400" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">fixed UMI sets only (Workflow B)</text><line x1="400" y1="130" x2="400" y2="146" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="200.0" y="148" width="400" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="400" y="167" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">bwa-mem3 mem --meth · fgumi zipper</text><text x="400" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">align raw reads (TAPs: without --meth)</text><line x1="400" y1="194" x2="400" y2="210" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="200.0" y="212" width="400" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="400" y="231" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">fgumi sort · fgumi group</text><text x="400" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">families of one strand: /A and /B with --strategy paired</text><path d="M400 258 L400 278 L200 278 L200 296" stroke="#586a74" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M400 278 L600 278 L600 296" stroke="#586a74" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="30.0" y="298" width="340" height="46" rx="7" fill="#ffffff" stroke="#0d5f7d" stroke-width="1.6"/><text x="200" y="317" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#0d5f7d" font-weight="bold" text-anchor="middle">fgumi simplex</text><text x="200" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">one read per strand, converted bases kept</text><line x1="200" y1="344" x2="200" y2="360" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30.0" y="362" width="340" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="200" y="381" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">bwa-mem3 mem --meth -Y · zipper</text><text x="200" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">re-align (TAPs: without --meth)</text><line x1="200" y1="408" x2="200" y2="424" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30.0" y="426" width="340" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="200" y="445" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">fgumi filter --ref</text><text x="200" y="462" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">needs aligned reads</text><line x1="200" y1="472" x2="200" y2="488" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30.0" y="490" width="340" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="200" y="509" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">fgumi sort</text><text x="200" y="526" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">coordinate order</text><line x1="200" y1="536" x2="200" y2="552" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="554" width="340" height="36" rx="7" fill="none" stroke="#d3dde1" stroke-width="1" stroke-dasharray="5 4"/><text x="200" y="577" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="middle">MethylDackel · Bismark extractor · XM</text><rect x="430.0" y="298" width="340" height="46" rx="7" fill="#ffffff" stroke="#6b4fb5" stroke-width="1.6"/><text x="600" y="317" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#6b4fb5" font-weight="bold" text-anchor="middle">fgumi duplex</text><text x="600" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">both strands, molecule's sequence + MM/ML</text><line x1="600" y1="344" x2="600" y2="360" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="430.0" y="362" width="340" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="600" y="381" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">bwa-mem3 mem -Y · zipper</text><text x="600" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">standard re-alignment</text><line x1="600" y1="408" x2="600" y2="424" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="430.0" y="426" width="340" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="600" y="445" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">fgumi filter --ref</text><text x="600" y="462" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">works aligned or not</text><line x1="600" y1="472" x2="600" y2="488" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="430.0" y="490" width="340" height="46" rx="7" fill="#f2f5f6" stroke="#d3dde1" stroke-width="1"/><text x="600" y="509" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.1" fill="#15222a" font-weight="bold" text-anchor="middle">fgumi sort</text><text x="600" y="526" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="middle">coordinate order</text><line x1="600" y1="536" x2="600" y2="552" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="430" y="554" width="340" height="36" rx="7" fill="none" stroke="#d3dde1" stroke-width="1" stroke-dasharray="5 4"/><text x="600" y="577" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="middle">modkit pileup-hemi · variant callers</text><text x="24" y="612" font-family="Helvetica, Arial, sans-serif" font-size="12.9" fill="#586a74" font-weight="normal" text-anchor="start">Dashed: optional step / downstream tools. The aligner flags shown are for EM-seq.</text></svg>
