ght="bold" text-anchor="middle">A</text><text x="278" y="191" font-family="Helvetica, Arial, sans-serif" font-size="14.0" fill="#586a74" font-weight="bold" text-anchor="end">reference, bottom strand  3'←5'</text><text x="303.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">C</text><text x="329.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">T</text><text x="355.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">G</text><text x="381.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">C</text><text x="407.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">A</text><text x="433.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">G</text><text x="459.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">T</text><text x="485.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">A</text><text x="511.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">G</text><text x="537.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" text-anchor="middle">C</text><text x="563.0" y="192" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#586a74" font-weight="normal" te