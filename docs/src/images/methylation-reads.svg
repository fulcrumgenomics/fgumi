<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d"><title id="t">What each read of a pair sees, and how reads form families</title><desc id="d">Panel A: Read 1 sequences the converted top strand and shows a T at reference C position 6; Read 2 sequences the copy and shows an A opposite it, at a reference G. Both reads report only the top strand's cytosines. Panel B: a molecule with UMIs on both ends is copied by PCR; paired grouping puts the copies of each strand in their own family, /A or /B.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#586a74"/></marker></defs><rect x="0.5" y="0.5" width="799" height="469" rx="10" fill="#ffffff" stroke="#d3dde1"/><text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15.7" fill="#15222a" font-weight="bold" text-anchor="start">A. Both reads of a pair describe the same original strand</text><rect x="24" y="48" width="14" height="14" rx="3" fill="none" stroke="#586a74" stroke-width="1.4"/><text x="44" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="start">informative position</text><rect x="198.0" y="48" width="14" height="14" rx="3" fill="#f5d3e5" stroke="none" stroke-width="1"/><text x="218.0" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="start">converted base</text><text x="303.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="middle">1</text><text x="329.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="middle">2</text><text x="355.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="middle