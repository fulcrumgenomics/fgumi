<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d"><title id="t">How a duplex consensus calls one cytosine</title><desc id="d">Three cases at one base pair. Top strand C with bottom strand G: the molecule has C:G and the cytosine is methylated; the duplex read shows C. Top strand T with bottom strand G: still C:G, an unmethylated cytosine; the duplex read shows C. Top strand T with bottom strand A: the molecule has T:A, a C&gt;T mutation; the duplex read shows T and there is no methylation call.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#586a74"/></marker></defs><rect x="0.5" y="0.5" width="799" height="439" rx="10" fill="#ffffff" stroke="#d3dde1"/><text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15.7" fill="#15222a" font-weight="bold" text-anchor="start">At a cytosine, only that cytosine's own strand can be converted</text><text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="14.0" fill="#586a74" font-weight="normal" text-anchor="start">The opposite strand has a G there, which conversion never changes, so the G proves the molecule has a C:G pair.</text><text x="24" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#0d5f7d" font-weight="bold" text-anchor="start">top-strand</text><text x="24" y="133" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#0d5f7d" font-weight="bold" text-anchor="start">family shows</text><text x="24" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#6b4fb5" font-weight="bold" text-anchor="start">bottom-strand</text><text x="24" y="191" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#6b4fb5" font-weight="bold" text-anchor="start">family shows</text><text x="24" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#15222a" font-weight="bold" text-anchor="start">the molecule has</text><text x="24" y="322" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#15222a" font-weight="bold" text-anchor="start">duplex read</text><text x="24" y="337" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#15222a" font-weight="bold" text-anchor="start">shows</text><text x="24" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#15222a" font-weight="bold" text-anchor="start">methylation call</text><rect x="258" y="96" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#0d5f7d" stroke-width="2"/><text x="280" y="127" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#1d5fc4" font-weight="bold" text-anchor="middle">C</text><rect x="258" y="154" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#6b4fb5" stroke-width="2"/><text x="280" y="185" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#b87300" font-weight="bold" text-anchor="middle">G</text><line x1="280" y1="206" x2="280" y2="236" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><text x="280" y="266" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#15222a" font-weight="bold" text-anchor="middle">C:G</text><rect x="258" y="300" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#15222a" stroke-width="2"/><text x="280" y="331" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#1d5fc4" font-weight="bold" text-anchor="middle">C</text><circle cx="203.9" cy="391" r="5" fill="#b3166f"/><text x="288" y="396" font-family="Helvetica, Arial, sans-serif" font-size="14.0" fill="#b3166f" font-weight="bold" text-anchor="middle">methylated cytosine</text><rect x="458" y="96" width="44" height="44" rx="6" fill="#f5d3e5" stroke="#0d5f7d" stroke-width="2"/><text x="480" y="127" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#c42f2b" font-weight="bold" text-anchor="middle">T</text><rect x="458" y="154" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#6b4fb5" stroke-width="2"/><text x="480" y="185" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#b87300" font-weight="bold" text-anchor="middle">G</text><line x1="480" y1="206" x2="480" y2="236" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="266" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#15222a" font-weight="bold" text-anchor="middle">C:G</text><rect x="458" y="300" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#15222a" stroke-width="2"/><text x="480" y="331" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#1d5fc4" font-weight="bold" text-anchor="middle">C</text><circle cx="396.1" cy="391" r="4.2" fill="#ffffff" stroke="#b3166f" stroke-width="1.6"/><text x="488" y="396" font-family="Helvetica, Arial, sans-serif" font-size="14.0" fill="#b3166f" font-weight="bold" text-anchor="middle">unmethylated cytosine</text><rect x="658" y="96" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#0d5f7d" stroke-width="2"/><text x="680" y="127" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#c42f2b" font-weight="bold" text-anchor="middle">T</text><rect x="658" y="154" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#6b4fb5" stroke-width="2"/><text x="680" y="185" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#2b8a3e" font-weight="bold" text-anchor="middle">A</text><line x1="680" y1="206" x2="680" y2="236" stroke="#586a74" stroke-width="1.5" marker-end="url(#arrow)"/><text x="680" y="266" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#15222a" font-weight="bold" text-anchor="middle">T:A</text><rect x="658" y="300" width="44" height="44" rx="6" fill="#f2f5f6" stroke="#15222a" stroke-width="2"/><text x="680" y="331" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#c42f2b" font-weight="bold" text-anchor="middle">T</text><text x="680" y="396" font-family="Helvetica, Arial, sans-serif" font-size="14.0" fill="#586a74" font-weight="bold" text-anchor="middle">C&gt;T mutation: no call</text><text x="24" y="426" font-family="Helvetica, Arial, sans-serif" font-size="13.4" fill="#586a74" font-weight="normal" text-anchor="start">The duplex read shows the molecule's real base, and the methylation call is stored in the MM/ML tags.</text></svg>
