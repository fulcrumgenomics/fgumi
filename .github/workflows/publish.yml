name: Manage Release PRs and Publish Crates

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Create or update release PR
        uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5.137
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Detect release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Publish only when this push is a release: the merge of a release-plz
          # release PR, which bumps the lockstep workspace version. Every other
          # push to main carries the already-released version with unreleased
          # code, and must not publish anything -- a crate added since the last
          # release waits for the next one, when it goes out with everything
          # else.
          #
          # Compare against the pre-push commit (`github.event.before`), not
          # HEAD^, so a push of several commits is judged as a whole. Re-running
          # a failed release run reuses the same event, so a partial publish can
          # still be resumed.
          root_version() {
            git show "$1:Cargo.toml" | sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p'
          }
          NEW_VERSION=$(root_version HEAD)
          if [ -z "$NEW_VERSION" ]; then
            echo "ERROR: could not read [workspace.package] version from Cargo.toml at HEAD."
            exit 1
          fi
          OLD_VERSION=$(root_version "$BEFORE_SHA" 2>/dev/null || true)
          if [ -z "$OLD_VERSION" ]; then
            # The pre-push commit is unreadable (e.g. a force-push). Err toward
            # not publishing: a missed release can be redone, an upload cannot.
            echo "::warning::could not read the version at $BEFORE_SHA; not publishing"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Workspace version: $OLD_VERSION -> $NEW_VERSION"
          # Require an increase, not just a change: a push that reverts the
          # version (e.g. 0.8.0 -> 0.7.0) would otherwise publish any crate
          # added since the old release at that old version. Compare by SemVer
          # precedence, as Cargo does -- `sort -V` ranks 0.8.0-rc.1 above 0.8.0
          # and would skip the final release. An unparseable version fails the
          # step rather than guessing.
          ORDER=$(python3 - "$OLD_VERSION" "$NEW_VERSION" <<'EOF'
          import sys

          def precedence(version):
              # Build metadata (+...) does not affect precedence.
              core, _, pre = version.split("+", 1)[0].partition("-")
              nums = tuple(int(n) for n in core.split("."))
              if len(nums) != 3:
                  raise ValueError(f"not a SemVer version: {version!r}")
              if not pre:
                  return (nums, 1, ())
              # Numeric identifiers rank below alphanumeric ones; a shorter
              # identifier list ranks below a longer one sharing its prefix.
              ids = tuple((0, int(i), "") if i.isdigit() else (1, 0, i) for i in pre.split("."))
              return (nums, 0, ids)

          old, new = (precedence(v) for v in sys.argv[1:3])
          print("increased" if new > old else "unchanged" if new == old else "decreased")
          EOF
          )
          if [ "$ORDER" = "unchanged" ]; then
            echo "Version unchanged -- not a release, nothing to publish"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$ORDER" = "decreased" ]; then
            echo "::warning::workspace version went down ($OLD_VERSION -> $NEW_VERSION); not publishing"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$ORDER" = "increased" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: unexpected version comparison result: '$ORDER'"
            exit 1
          fi
      - name: Verify lockstep workspace versions
        if: steps.release.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "fgumi") | .version')
          MISMATCHES=$(cargo metadata --no-deps --format-version 1 | jq -r \
            --arg ver "$WORKSPACE_VERSION" \
            '.packages[] | select(.name | startswith("fgumi-")) | select(.version != $ver) | "\(.name) \(.version)"')
          if [ -n "$MISMATCHES" ]; then
            echo "ERROR: workspace version drift detected (expected $WORKSPACE_VERSION):"
            echo "$MISMATCHES"
            exit 1
          fi
          echo "All workspace crates at v$WORKSPACE_VERSION"
      - name: Publish workspace crates in dependency order
        id: publish
        if: steps.release.outputs.is_release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # All workspace crates share a single version (lockstep), so the root
          # crate's version is the target version for every crate. Crates already
          # at that version are skipped per crate below, so re-running a release
          # that failed partway resumes it instead of re-uploading.
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "fgumi") | .version')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version for all workspace crates: v$VERSION"

          # The publish list and its completeness/ordering checks live in
          # scripts/publish-crates.sh so CI can run them on every PR (see the
          # `publish-order` job in check.yml). Re-run here too: this is the last
          # point before an irreversible upload.
          ./scripts/publish-crates.sh --check
          mapfile -t CRATES < <(./scripts/publish-crates.sh --list)

          # `mapfile` reads a process substitution, and bash does not propagate
          # its exit status -- a failing `--list` leaves CRATES empty, `set -e`
          # sees nothing wrong, the loop below never runs, and the step reports
          # "nothing to publish" and SUCCEEDS while the release step still tags
          # the version. An empty list is never legitimate here, so fail loudly.
          if [ "${#CRATES[@]}" -eq 0 ]; then
            echo "ERROR: publish-crates.sh --list produced no crates."
            echo "Refusing to continue: an empty publish list would silently"
            echo "release nothing while reporting success."
            exit 1
          fi

          # Ask whether THIS EXACT version exists, not whether it is the crate's
          # highest. Comparing against `max_version` only skips correctly when
          # the target is the newest release; if a crate's max_version is HIGHER
          # than the target — re-running an older tag, or a crate that drifted
          # out of lockstep — the skip does not fire, `cargo publish` fails with
          # "already uploaded", and because this loop runs under `set -e` every
          # crate after it is never published. That is the partial-release this
          # workflow exists to avoid, and a published version cannot be deleted,
          # only yanked. A 404 (not yet published at this version, including a
          # crate added since the last release) correctly means "publish it".
          PUBLISHED_ANY=false
          for crate in "${CRATES[@]}"; do
            # Retry the probe: it is an idempotent read, and both failure modes
            # it guards are usually transient. They fail differently, and
            # neither used to be survivable: a transport error (DNS, TLS, reset,
            # timeout) exits curl non-zero and killed the step outright under
            # `set -e`, while a 429/5xx exits curl ZERO and fell to the `*)` arm
            # below, which hard-fails on an ambiguous status. Either one landing
            # after earlier crates uploaded produces exactly the partial release
            # this loop exists to prevent, so let a blip retry instead. curl
            # retries 429/500/502/503/504 natively; `--retry-all-errors` extends
            # that to the transport errors. 200 and 404 are successful transfers
            # to curl and are never retried, so the skip and publish paths pay
            # no added latency. Timeouts bound a hung connection.
            CURL_RC=0
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              -H "User-Agent: fgumi-ci (https://github.com/fulcrumgenomics/fgumi)" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}") || CURL_RC=$?

            if [ "$CURL_RC" -ne 0 ]; then
              echo "ERROR: querying crates.io for $crate v$VERSION failed after"
              echo "retries (curl exit $CURL_RC). Refusing to publish without a"
              echo "definitive answer: publishing blind could double-publish, and"
              echo "a published version cannot be deleted, only yanked."
              exit 1
            fi

            case "$STATUS" in
              200)
                echo "$crate v$VERSION already exists on crates.io -- skipping"
                continue
                ;;
              404) ;;  # not published at this version -- publish it below
              *)
                echo "ERROR: unexpected HTTP $STATUS querying crates.io for $crate v$VERSION."
                echo "Refusing to publish on an ambiguous answer: treating it as"
                echo "not-published could double-publish, and as published could"
                echo "silently skip a crate."
                exit 1
                ;;
            esac

            echo "Publishing $crate v$VERSION..."
            cargo publish -p "$crate"
            echo "✓ Published $crate v$VERSION"
            PUBLISHED_ANY=true
          done

          if [ "$PUBLISHED_ANY" = "false" ]; then
            echo "All crates already at v$VERSION -- nothing to publish"
          fi

      - name: Create GitHub release
        if: steps.publish.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.publish.outputs.version }}"
          TAG="v${VERSION}"

          # Idempotent: skip if tag/release already exist (e.g. from a
          # previous partial run that published crates but failed here).
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
          fi
          if ! git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "v${VERSION}" \
              --generate-notes \
              --latest
          else
            echo "Release $TAG already exists -- skipping"
          fi
