name: Check and Test

on:
  push:
    branches:
      - main
  pull_request:
  # Run in the merge queue too. GitHub evaluates `merge_group` workflows from the
  # target branch (main), so these checks gate every group the queue assembles;
  # the branch ruleset lists these job names as the queue's required checks.
  merge_group:

# Every job here only checks out the repo and runs read-only build/test/lint
# steps (the coverage upload authenticates with CODECOV_TOKEN, not the workflow
# token), so drop the inherited GITHUB_TOKEN down to read-only for all of them.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest
      - name: Unit tests
        run: cargo ci-test
      - name: Doctests
        run: cargo ci-doctest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Clippy check
        run: cargo ci-lint

  # Builds and tests the optional in-process bwa-mem3 aligner backend (feature
  # `aligner-bwa-mem3`, off by default). This is the one feature that pulls a
  # C++ toolchain into the build (the vendored bwa-mem3 kernels via
  # `bwa-mem3-sys`'s `cc`-driven build.rs), so it gets its own job rather than
  # folding into `test`/`lint`: those two stay C-toolchain-free, matching every
  # other job's fast/portable assumption.
  #
  # Matrix covers both architectures the feature compiles on (the dependency is
  # gated in Cargo.toml to `x86_64`/`aarch64` — see the `bwa-mem3-rs` entry).
  # `ubuntu-24.04-arm` is a real (not emulated) arm64 GitHub-hosted runner, so
  # this exercises the NEON build path, not just the x86_64 SIMD-tier ladder.
  #
  # Toolchain deps are deliberately minimal: `build-essential` (a C++17-capable
  # g++) and `zlib1g-dev` (the crate links `z`) are everything `bwa-mem3-sys`'s
  # build.rs actually needs for a normal build — mirrors fg-labs/bwa-mem3-rs's
  # own `build`/`lint` jobs. Two toolchain pieces this job deliberately does
  # NOT install:
  #   - `libclang-dev`: bindgen only runs under the sys crate's own
  #     `regenerate-bindings` feature (gated in its build.rs), which this job
  #     never enables — the committed bindings are used as-is.
  #   - clang-19 / libomp: bwa-mem3's Makefile compiler floor (clang >= 19 /
  #     gcc >= 15) applies to building the vendored bwa-mem3 CLI *from
  #     upstream* (fg-labs/bwa-mem3-rs's own `e2e` job does that, to diff
  #     against this crate's output byte-for-byte); `cc` enforces no such floor
  #     on the sys crate itself, and this job never builds the reference CLI
  #     binary. The real-index / real-binary parity matrix runs in the
  #     `e2e-parity` job below.
  aligner-ffi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps (C++17 toolchain for bwa-mem3-sys)
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest
      - name: Unit tests (aligner-bwa-mem3)
        run: cargo nextest run --features aligner-bwa-mem3 -p fgumi --locked
      - name: Clippy (aligner-bwa-mem3, pedantic)
        # Lints compare,simulate,profile-adjacency,aligner-bwa-mem3 together:
        # the first three are already part of every default dev/test build's
        # assumed surface (`cargo ci-lint` compiles them), so linting them
        # together with the aligner feature catches any interaction between the
        # two rather than linting the aligner feature in isolation.
        run: |
          cargo clippy --workspace --all-targets \
            --features compare,simulate,profile-adjacency,aligner-bwa-mem3 --locked \
            -- -D warnings -W clippy::pedantic
      - name: Rustdoc (aligner-bwa-mem3, -D warnings)
        # `cargo ci-doc` (the `docs` job) does not enable `aligner-bwa-mem3`, so
        # the feature-gated in-process backend's docs are rendered only here.
        # Clippy does not report broken intra-doc links; rustdoc does.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p fgumi --document-private-items --features aligner-bwa-mem3 --locked

  # End-to-end byte-parity acceptance gate: the in-process bwa-mem3
  # backend's merged BAM must be byte-identical to the subprocess `bwa-mem3`
  # preset's, save the `@PG CL` field. Parity is only defined against the SAME
  # bwa-mem3 version the crate vendors, so this job builds the reference CLI
  # binary from the vendored commit (the pixi/bioconda binary a dev box carries
  # is a different version and would diverge spuriously — which is exactly why
  # `tests/align_inproc_parity.rs` skips unless handed a matching binary). This
  # is the heavier sibling of `aligner-ffi` (which only builds the feature and
  # runs its unit tests, no reference binary): it additionally needs clang-19
  # (the vendored bwa-mem3 Makefile's compiler floor), libdeflate, samtools, and
  # a built PhiX-scale index, so it is a separate job. Mirrors fg-labs/
  # bwa-mem3-rs's own `e2e` job pattern (the proven approach).
  #
  # Matrix covers both architectures the feature compiles on, each pinned to the
  # SIMD tier both the reference binary (`make arch=<bwa_arch>`) and the linked
  # in-process kernels (bwa-mem3-sys's cc build) must share for byte-parity —
  # avx2 on x86, arm64/NEON on arm. fg-labs/bwa-mem3#513 retired the pre-AVX2
  # x86 tiers, so avx2 is the x86 floor.
  e2e-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bwa_arch: avx2
          - os: ubuntu-24.04-arm
            bwa_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps + samtools
        # build-essential + zlib1g-dev: bwa-mem3-sys's cc build (the in-process
        # kernels). libdeflate-dev: the vendored bwa-mem3 Makefile links it when
        # building the reference CLI from upstream (unlike the pruned sys-crate
        # snapshot). samtools: builds the smoke-test index's `.fai`/`.dict`.
        # autoconf/automake: the upstream Makefile's submodule builds.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libdeflate-dev \
            samtools autoconf automake
      - name: Install clang-19 (verified LLVM apt repo)
        # The vendored bwa-mem3 Makefile requires clang >= 19 / gcc >= 15 (the
        # runner ships an older gcc), and clang's -fopenmp (libsais LIBSAIS_OPENMP)
        # needs libomp. Install from apt.llvm.org via a pinned repo whose signing
        # key is fingerprint-verified before use — NOT `llvm.sh | sudo bash` — so
        # a tampered mirror or installer cannot run code as root (CWE-494).
        # Mirrors fg-labs/bwa-mem3-rs's e2e job and fg-labs/bwa-mem3's release.yml.
        run: |
          set -euo pipefail
          . /etc/os-release
          codename="${VERSION_CODENAME:-$(lsb_release -cs)}"
          expected_fpr="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          got_fpr="$(gpg --show-keys --with-colons --with-fingerprint /tmp/llvm-snapshot.gpg.key | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ "$got_fpr" != "$expected_fpr" ]; then
            echo "FATAL: LLVM archive key fingerprint mismatch: got '$got_fpr', expected '$expected_fpr'" >&2
            exit 1
          fi
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo gpg --dearmor -o /etc/apt/keyrings/llvm-snapshot.gpg /tmp/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 libomp-19-dev
          clang++-19 --version | head -1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest
      - name: Build reference bwa-mem3 from upstream at the vendored COMMIT
        # Byte-parity is only defined against the exact bwa-mem3 the crate
        # vendors. This SHA is the full 40-hex of the vendored v0.14.0 release
        # (`5c1d5e39`), fixed by the `bwa-mem3-rs` 0.4.2 Cargo pin (its
        # bwa-mem3-sys/vendor/COMMIT). If the Cargo pin is bumped, update this to
        # match; the check below fails fast on a mismatch rather than letting it
        # surface as spurious parity divergence. The fetch is tagless
        # (`--no-tags`), so this binary may report `@PG VN` with a `-<sha>`
        # suffix; the parity test strips it.
        run: |
          set -euo pipefail
          sha="5c1d5e39e0b05fe3cf960ed0dc6086af59b3e870"
          # Resolve the locked bwa-mem3-sys checkout (cargo metadata fetches the
          # git dep) and compare its vendor/COMMIT against `sha`.
          sys_manifest="$(cargo metadata --format-version 1 --locked --features aligner-bwa-mem3 \
            | python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "bwa-mem3-sys"))')"
          vendored="$(tr -d '[:space:]' < "$(dirname "$sys_manifest")/vendor/COMMIT")"
          if [ "$vendored" != "$sha" ]; then
            echo "FATAL: bwa-mem3-sys vendors bwa-mem3 '$vendored' but this step builds '$sha'; update sha to match the Cargo pin" >&2
            exit 1
          fi
          # Blobless + depth-1 fetch of just the vendored SHA — avoids pulling the
          # full upstream commit graph. The vendored sys-crate snapshot is pruned
          # (no ext/htslib, ext/libsais, ext/mimalloc), which the Makefile needs,
          # so clone fresh at the same SHA with all submodules.
          git init /tmp/bwa-mem3
          git -C /tmp/bwa-mem3 remote add origin https://github.com/fg-labs/bwa-mem3.git
          git -C /tmp/bwa-mem3 fetch --filter=blob:none --no-tags --depth=1 origin "$sha"
          git -C /tmp/bwa-mem3 checkout FETCH_HEAD
          git -C /tmp/bwa-mem3 submodule update --init --recursive --depth 1
          make -C /tmp/bwa-mem3 arch=${{ matrix.bwa_arch }} CXX=clang++-19 CC=clang-19 -j"$(nproc)" all
          echo "BWA_MEM3_BIN=/tmp/bwa-mem3/bwa-mem3" >> "$GITHUB_ENV"
          # Also put it on PATH, so anything resolving a bare `bwa-mem3` gets the
          # vendored-commit binary rather than none.
          echo "/tmp/bwa-mem3" >> "$GITHUB_PATH"
      - name: Build a PhiX-scale reference + index with the reference binary
        # For the in-process engine smoke unit test, which loads a prebuilt index
        # from FGUMI_BWA_MEM3_TEST_REF. (The two parity suites build and index
        # their own fixture reference with BWA_MEM3_BIN.) Build the bwa-mem3
        # index WITH THE REFERENCE BINARY, so the in-process backend, which links
        # the same commit, loads it.
        run: |
          set -euo pipefail
          mkdir -p /tmp/fgumi-parity-ref
          ref=/tmp/fgumi-parity-ref/ref.fa
          python3 -c "import random; random.seed(42); print('>ref'); print(''.join(random.choice('ACGT') for _ in range(20000)))" > "$ref"
          "$BWA_MEM3_BIN" index "$ref"
          samtools faidx "$ref"
          samtools dict "$ref" -o /tmp/fgumi-parity-ref/ref.dict
          echo "FGUMI_BWA_MEM3_TEST_REF=$ref" >> "$GITHUB_ENV"
      - name: Backend byte-parity + determinism matrix
        # FGUMI_BWA_MEM3_REQUIRE_TOOLS makes a missing binary or index fail rather
        # than skip, so this job cannot silently degrade into a no-op — the whole
        # reason it exists is to actually run the gate. Runs BOTH parity suites:
        # align_inproc_parity (in-process vs subprocess byte-parity) and
        # align_subprocess_split_parity (the subprocess align/merge guard). Both
        # take the reference binary from BWA_MEM3_BIN, set by the build step above.
        env:
          FGUMI_BWA_MEM3_REQUIRE_TOOLS: "1"
        run: |
          cargo nextest run --features aligner-bwa-mem3 -p fgumi --locked \
            --test align_inproc_parity --test align_subprocess_split_parity --no-fail-fast
      - name: In-process engine smoke test against a real index
        # The only unit test that drives the real BwaMem3Engine. It loads the
        # index built above from FGUMI_BWA_MEM3_TEST_REF; with
        # FGUMI_BWA_MEM3_REQUIRE_TOOLS set, a missing index fails instead of
        # skipping.
        env:
          FGUMI_BWA_MEM3_REQUIRE_TOOLS: "1"
        run: |
          cargo nextest run --features aligner-bwa-mem3 -p fgumi --locked --lib \
            -E 'test(bwa_mem3_engine_smoke_pair_emit)'

  # `merge_slots.rs` swaps `std::sync` for `loom::sync` under `--cfg loom`, and
  # `tests/loom_merge_slots.rs` is `#![cfg(loom)]`. Neither is built by any other
  # job, so without this one a broken model — or a `cfg(loom)` build that stopped
  # compiling — is invisible: the test target compiles to an empty binary under a
  # normal build and reports success. That silence is the whole reason this job
  # exists.
  #
  # Per-PR rather than on a schedule, unlike `miri.yml` and `stress.yml`. Those
  # two are scheduled because they are non-deterministic in ways unrelated to a
  # given change (a nightly-toolchain regression; timing sensitivity). Loom
  # explores a bounded state space deterministically — four of the five models
  # under a preemption bound, see the test's "Preemption-bounded exploration"
  # note — so the same input yields the same verdict with no flake, which is
  # what lets it gate a PR, and a gate is what stops it rotting.
  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Release: the models explore enough interleavings that a debug build takes
      # several times as long for the same verdict.
      - name: Loom model check (SortMergeSlot)
        run: cargo test -p fgumi-sort --test loom_merge_slots --release
        env:
          RUSTFLAGS: --cfg loom

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'
    environment: github-actions
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-llvm-cov
      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest
      - name: Generate coverage
        # Includes `fgumi-pipeline-io/stress-tests`: the soak/matrix/proptest
        # suites are gated off the fast `test` job, but they cover ~200 lines that
        # nothing else reaches. Measuring without them under-reports patch
        # coverage for code that IS tested, just not on the PR-latency path.
        run: cargo llvm-cov nextest --workspace --features compare,simulate,profile-adjacency,fgumi-pipeline-io/stress-tests --no-tests=pass --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Rustfmt check
        run: cargo ci-fmt

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-audit
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

  # The publish ORDER check, run per-PR. `publish.yml` runs it too, but that
  # workflow only triggers on push to `main` — so before this job existed, a
  # crate missing from the publish list, or one listed before its dependency,
  # was discovered mid-publish, on main, after earlier crates had already gone
  # to crates.io. A published version cannot be deleted, only yanked, so the
  # failure is not recoverable by re-running. Every check here is pure
  # `cargo metadata` plus list arithmetic — no registry access, no secrets, a
  # couple of seconds — so there is no reason for it to wait for release day.
  #
  # This is distinct from `publish-dry-run` below, which validates each crate's
  # MANIFEST (declared versions on path deps, include paths, feature refs). That
  # says nothing about whether the publish list is complete or correctly ordered.
  publish-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Validate the crates.io publish list is complete and correctly ordered
        run: ./scripts/publish-crates.sh --check

  publish-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Package every workspace crate (dry-run)
        # Validates manifest health for every publishable crate: declared
        # dependency versions on path deps, include = [...] paths, features
        # referring to real deps/features, no-publish flags, etc. Uses
        # --no-verify because cargo's workspace dry-run with --verify hits
        # an internal "no hash listed" error (cargo 1.93) when a later
        # crate transitively depends on an earlier crate's freshly packaged
        # tarball. Real-CI publish doesn't hit this -- each predecessor
        # resolves from crates.io with a real hash before the next verify.
        run: cargo publish --workspace --dry-run --allow-dirty --no-verify
      - name: Simulate publish-verify for crates with default-off optional deps
        # `cargo publish --verify` compiles the packaged tarball with DEFAULT
        # features only. For crates whose default feature set does NOT enable
        # every optional dependency, that build path is not exercised by the
        # regular workspace build (other crates often enable the optional
        # feature transitively), so "optional dep used unconditionally" bugs
        # can ship unnoticed and break publish mid-release.
        #
        # Add a crate to this list whenever it gains a default-off optional
        # dep. Current members:
        #   - fgumi-raw-bam: default = [], `noodles`/`anyhow` behind feature
        run: cargo check -p fgumi-raw-bam --no-default-features --all-targets

  no-default-features-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: cargo check --workspace --no-default-features --all-targets
        # The regular test/lint jobs run with default features enabled, which
        # pulls in every optional dependency transitively. That hides two
        # classes of bug from CI:
        #   1. Optional deps used unconditionally (library behind a feature
        #      gate referenced from non-gated code).
        #   2. Modules behind a non-default feature referenced from
        #      always-compiled code.
        # Both manifest as compile failures only under
        # `default-features = false`, which is exactly what downstream
        # consumers can opt into. This job compiles every workspace crate
        # (lib + tests + benches) with no default features to surface
        # regressions at PR time.
        run: cargo check --workspace --no-default-features --all-targets

  msrv-lockstep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust-version matches the pinned toolchain
        # We support exactly the Rust we develop and test on: `rust-version`
        # (the published MSRV) is kept identical to the `channel` in
        # rust-toolchain.toml. This fails if the two drift, so neither can be
        # bumped without the other. Because every other job builds on the
        # rust-toolchain.toml channel, keeping them equal means all of CI
        # already verifies the MSRV builds -- no separate MSRV build job needed.
        run: |
          set -euo pipefail
          msrv=$(grep -m1 -E '^rust-version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          chan=$(grep -m1 -E '^channel' rust-toolchain.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Cargo.toml rust-version = $msrv"
          echo "rust-toolchain.toml channel = $chan"
          if [ "$msrv" != "$chan" ]; then
            echo "::error::MSRV ($msrv) and pinned toolchain ($chan) have drifted; keep them in lockstep." >&2
            exit 1
          fi

  coderabbit-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: .coderabbit.yaml is valid and still aimed at code that exists
        # CodeRabbit never reports a configuration error on the PR: when the
        # file violates its schema the bot discards it wholesale and reviews
        # with org-UI defaults instead, so the repo silently loses every path
        # instruction. That has already happened here (a 293-character
        # `tone_instructions` against a 250-character cap). This makes the
        # failure loud, and additionally fails when a path instruction stops
        # matching any tracked file -- a glob left behind by a rename keeps
        # "working" while aiming the reviewer at nothing.
        run: python3 scripts/check-coderabbit-config.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Turn every rustdoc warning (broken intra-doc links, private-item links,
    # etc.) into a hard error. This gates doc *build* and link health; doctest
    # *execution* (running the `///` examples) is a separate concern not covered
    # here — nextest does not run doctests either.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build documentation
        run: cargo ci-doc

  sort-correctness:
    runs-on: ubuntu-latest
    # A stalled apt mirror on the "Install samtools" step has hung this job for
    # 30+ minutes (up to GitHub's 6-hour default). Cap it so an infrastructure
    # stall fails fast and is obvious, instead of masquerading as a slow job.
    timeout-minutes: 20
    # This job only reads the repository -- it builds and runs tests, and never
    # writes back to GitHub. Drop the default GITHUB_TOKEN scopes to read-only so
    # the token exposed to test code cannot mutate the repo.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest
      - name: Install samtools
        # The sort-correctness suites (tests/integration/test_sort_correctness.rs,
        # test_async_reader.rs, test_sort_write_index.rs) need the `samtools` binary to
        # build BAM fixtures, count records, and query the fgumi-written .bai index.
        # Sort ordering itself is verified by `fgumi sort --verify` (fgumi's own order
        # checker), not by diffing against `samtools sort` — this job gates internal
        # sort-correctness, not samtools output parity. These tests are `#[ignore]`d
        # because they need samtools; without this job they never run in CI, so
        # sort-correctness was ungated. samtools is taken from the runner's apt repo —
        # the tests never parse samtools' record order, so they do not depend on a
        # specific samtools patch version.
        #
        # Bound each apt call and retry: a stalled Azure apt mirror otherwise
        # hangs `apt-get` indefinitely (observed 40+ min), and with the job
        # timeout above that would waste the whole budget on one bad mirror.
        # Acquire::Retries + a per-request timeout make a stuck mirror error out
        # quickly, and the outer loop retries the transient failure. DEBIAN_
        # FRONTEND=noninteractive guards against any post-install config prompt.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get update "${apt_opts[@]}" \
              && sudo apt-get install -y "${apt_opts[@]}" samtools; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "apt attempt ${attempt} failed; retrying in 15s" >&2
              sleep 15
            fi
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - name: Verify samtools is on PATH
        # The samtools-gated suites early-return when `samtools_available()`
        # (which shells out to `samtools --version`) is false, so a missing binary
        # would let this job pass without running any of them. Fail loudly instead:
        # this asserts the exact predicate the tests gate on.
        run: samtools --version
      - name: Run samtools-gated sort-correctness tests
        run: cargo ci-test-samtools

  all-features-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--all-features` below now also enables `aligner-bwa-mem3`, which pulls
      # in `bwa-mem3-sys`'s C++ build (see the `aligner-ffi` job's comment for
      # why this is the minimal dep set — no libclang/clang-19 needed here).
      - name: Install build deps (C++17 toolchain for bwa-mem3-sys)
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: cargo check --workspace --all-features --all-targets
        # The regular jobs only build a fixed feature set (default +
        # compare,simulate,profile-adjacency), and no-default-features-check builds
        # the all-off end. That leaves several declared features never compiled in
        # CI -- notably `memory-debug` (dozens of instrumentation sites), `dhat-heap`,
        # and `stress-tests` -- free to bit-rot. Enabling every feature at once
        # compiles all of them (and any future feature automatically), across
        # lib + tests + benches, so a feature that stops compiling fails at PR time.
        # `--locked` keeps the job on the committed Cargo.lock (matching the ci-*
        # aliases) so a drifting lockfile fails here instead of silently re-resolving.
        run: cargo check --workspace --all-features --all-targets --locked
