name: Miri (undefined-behavior check)

# The approved `unsafe` hot paths document `# SAFETY` invariants that only human
# review has enforced. Miri interprets the tests that exercise them and flags
# undefined behavior (out-of-bounds, invalid pointer use, aliasing violations),
# turning those invariants into a machine-checked gate.
#
# Scope: `fgumi-raw-bam`, which contains the raw-pointer queryname comparator
# (`natural_compare` / `natural_compare_nul`, via `get_unchecked` and `*const u8`
# walks) and has no FFI. `fgumi-sort` is intentionally not covered yet: its
# `memory_probe` module calls the mimalloc / mach2 FFI, which Miri cannot execute,
# so covering its radix-sort unsafe needs `#[cfg(not(miri))]` guards first
# (tracked as a follow-up).
#
# Two triggers, two jobs to do.
#
# **Per-PR, path-filtered — the gate.** A PR that touches `fgumi-raw-bam` gets
# Miri before it merges, because the only thing Miri can tell you is which change
# introduced the UB, and a nightly-only run answers that with "somewhere in
# yesterday's merges." The filter is what keeps the original objection to per-PR
# runs (a nightly-Miri regression should not block unrelated work) true: a PR that
# does not touch the covered crate never starts this workflow, so it cannot be
# blocked by it. The PRs it can block are exactly the ones that can introduce UB
# here. Cost is not the constraint at this scope — the scoped `sort` tests run in
# seconds, against a `test` job that takes minutes.
#
# Deliberately no `push:` on `main`: a `pull_request` run already tests the
# simulated merge commit, so a merged PR was covered by construction, and the cron
# below re-checks `main` daily anyway. Adding it would double every Miri run to buy
# a few hours of latency on drift the cron already finds.
#
# **Daily cron — the canary.** Keeps covering two things a PR run cannot: a
# nightly-Miri or toolchain regression against *unchanged* code, and `main` itself
# between merges. It is also where scope can widen (the `fgumi-sort` FFI exclusion
# above) without putting that cost on every PR. A failing cron files a tracking
# issue; see the `report-failure` job, which is gated to the scheduled trigger so
# a PR failure stays in that PR's checks.
on:
  pull_request:
    # Server-side filtering, with one documented limit: GitHub evaluates `paths`
    # against only the first 3,000 files of a diff, so a PR larger than that which
    # touches the covered crate could fail to start this workflow. Accepted rather
    # than worked around. The alternative -- trigger on every PR and re-derive the
    # changed paths in a gating job -- puts a job on every PR in the repository to
    # cover a diff shape (3,000+ files, including `crates/fgumi-raw-bam`) that
    # would be a vendored-dependency dump, not a change to the comparator this
    # gate protects. Revisit if that ever stops being true.
    paths:
      # The covered crate, and this workflow itself — editing the scope or the
      # guards below should re-run them.
      - "crates/fgumi-raw-bam/**"
      - ".github/workflows/miri.yml"
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch: {}

# The job reads the repository and runs tests; it never writes back to contents.
# `issues: write` is granted to the `report-failure` job alone, which is the only
# thing here that writes anything.
permissions:
  contents: read

# Only the newest run per ref stays alive. `github.ref` is `refs/pull/N/merge` for
# a PR, so a force-push to a PR cancels its own in-flight run without touching
# anyone else's; a manual dispatch overlapping (or a delayed) scheduled run on the
# same ref likewise adds no signal.
concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the raw-pointer proptest agreement test tractable under Miri's
  # interpreter. Note this only reaches proptest because the step below disables
  # Miri's isolation: an isolated `env::vars_os()` sees none of the host
  # environment, so every `PROPTEST_*` knob is silently ignored.
  PROPTEST_CASES: "32"

jobs:
  miri:
    runs-on: ubuntu-latest
    # The scoped `sort` tests take seconds locally; anything near this cap means
    # the interpreter (or a nightly regression) is hung. Fail fast rather than idle
    # at GitHub's 6-hour default — on a daily cron nobody is watching, and on a PR
    # nobody wants to.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in `.git/config`.
          persist-credentials: false
      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable action, nightly toolchain
        with:
          toolchain: nightly
          components: miri
      - name: Miri — fgumi-raw-bam raw-pointer comparator
        # Scope to the `sort` module: that is where the approved `unsafe` lives
        # (`natural_compare`/`natural_compare_nul` — `get_unchecked` and `*const u8`
        # walks). The rest of the crate can't run under Miri anyway: the `sequence`
        # SIMD tests call platform intrinsics (NEON on arm, SSE/AVX on x86) that Miri
        # cannot interpret, and the BAM encode/decode roundtrip tests are slow and
        # exercise no `unsafe` of ours. The `sort` tests (comparator + coordinate/
        # queryname raw-key tests) run clean under Miri in a few seconds.
        env:
          # `test_natural_compare_agrees_with_nul` is a `proptest`, and proptest
          # resolves the path to its `.proptest-regressions` file through
          # `std::env::current_dir()` before running a single case. `getcwd` is
          # unsupported under Miri's default isolation, so that test aborted the
          # whole step — this workflow had never once passed. Isolation is safe
          # to drop here: these tests are pure comparator calls over in-memory
          # byte buffers, so every host access it re-permits is proptest's, not
          # theirs — that `current_dir()` lookup; the `env::vars_os()` read
          # through which it picks up the `PROPTEST_*` knobs (here the
          # `PROPTEST_CASES` cap set above, which isolation had been silently
          # discarding); and reading — on failure, writing — the
          # `.proptest-regressions` file the lookup resolves to.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p fgumi-raw-bam sort

  # Nothing watches a cron's result, so a failure has to announce itself. See the
  # action for why it reuses one issue per workflow.
  #
  # A separate job rather than a final step in `miri`, because the two failures
  # most worth reporting are the ones a step could not report on. A step there
  # `uses: ./...`, which only resolves once the repository is on disk, so a failed
  # checkout takes the reporting down with it; and `timeout-minutes` *cancels* the
  # job, which skips `if: failure()` steps entirely -- so the hang that bound
  # exists to catch would go unreported. A separate job checks out for itself and
  # reads the outcome from `needs`, which survives both.
  report-failure:
    needs: miri
    # `always()`, or this job is skipped along with its cancelled dependency --
    # which would give back the timeout blind spot the job exists to close.
    #
    # `cancelled` as well as `failure` because GitHub documents a `timeout-minutes`
    # overrun as cancelling the job, and does not state which of the two it then
    # reports; matching both makes a hang reportable either way. The cost is that
    # a deliberately cancelled scheduled run also files -- but a human cancelling
    # a nightly cron was watching it, and the dedupe folds that into one issue
    # they can close. A hang has nobody watching, which is the whole problem.
    #
    # Scheduled runs only: a `workflow_dispatch` failure is already in front of
    # whoever dispatched it, and -- once a workflow also runs on `pull_request` --
    # a PR failure is visible in that PR's checks. Filing an issue for either is
    # noise; the silent trigger is the one that needs it.
    if: >-
      always()
      && (needs.miri.result == 'failure' || needs.miri.result == 'cancelled')
      && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # The only write access in this workflow, scoped to the one job that writes.
    permissions:
      contents: read
      issues: write
    # A checkout and three `gh` calls; minutes here mean stuck, not busy.
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report failure
        uses: ./.github/actions/report-cron-failure
        with:
          token: ${{ github.token }}
