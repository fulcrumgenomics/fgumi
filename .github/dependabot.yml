version: 2
updates:
  # Maintain dependencies for Cargo
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Bumped by .github/workflows/bwa-mem3-rs-bump.yml instead, which also
    # updates the CI pins that track the vendored bwa-mem3. Compatible
    # bwa-mem3-sys patches can change that commit too, so neither crate may
    # advance independently of the synchronized updater.
    ignore:
      - dependency-name: "bwa-mem3-rs"
      - dependency-name: "bwa-mem3-sys"
    groups:
      all-cargo-deps:
        patterns: ["*"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns: ["*"]
